name: Update Contribution Activity

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: AkarshKumar1
          options: >-
            theme=github-dark-blue
            &bg_color=0D1117
            &color=58A6FF
            &line=1F6FEB
            &point=58A6FF
            &area=true
            &area_color=1F6FEB
            &hide_border=true
            &custom_title=Contribution%20Activity
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity-graph.svg

          git commit -m "Update contribution activity" || exit 0

          git push
